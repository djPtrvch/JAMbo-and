name: Android debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Тесты Core на Linux: сверка C++-порта с эталонами ветки swift JAMbo.
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch golden files and json
        run: scripts/fetch-test-deps.sh
      - name: Build and run
        run: |
          cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests -j
          timeout 600 build/tests/core_tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          # Кэш зависимостей и на рабочих ветках: иначе каждая сборка качает всё заново
          # и Maven Central отвечает 429 (Too Many Requests).
          cache-read-only: false

      - name: Fetch Ableton Link
        run: scripts/fetch-deps.sh

      - name: Build debug APK
        # До трёх попыток: сетевые сбои репозиториев (429, обрывы) не должны ронять сборку.
        run: |
          for i in 1 2 3; do
            gradle --no-daemon assembleDebug && exit 0
            echo "Attempt $i failed, retrying in 30 s"; sleep 30
          done
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jambo-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jambo-debug-${{ github.run_number }}
          path: jambo-debug.apk

      # Постоянная ссылка для установки с устройства:
      # releases/download/debug-<ветка>/jambo-debug.apk
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" jambo-debug.apk --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build ${{ github.run_number }} ($GITHUB_REF_NAME)" \
            --notes "Commit $GITHUB_SHA"
